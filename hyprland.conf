# ▒░ Hyprland Config ░▒
# Autogenerated base config by dotfiles-setup.sh

# ▓ GLOBAL SETTINGS ▓
monitor=,preferred,auto,1.0
exec-once=dbus-launch hyprctl setcursor default 24
exec-once=waybar & dunst & nm-applet & wl-paste --watch cliphist store & swaybg -i /usr/share/backgrounds/archlinux/archlinux.jpg
exec-once=alacritty

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    drop_shadow = true
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, myBezier
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, myBezier
}

# ▓ KEYBINDINGS ▓
$mainMod = SUPER

# App launching
bind = $mainMod, RETURN, exec, alacritty
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, B, exec, brave
bind = $mainMod, V, exec, code
bind = $mainMod, T, exec, thunar

# Window management
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, F, fullscreen

# Focus movement
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move windows to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Reload background
bind = $mainMod, M, exit,

# ▓ AUTOSTART APPS (adjusted for dotfiles) ▓
exec-once = nm-applet
exec-once = dunst
exec-once = wl-paste --watch cliphist store
exec-once = waybar